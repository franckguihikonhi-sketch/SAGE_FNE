name: CI

on:
  # Sur la branche par défaut seulement : sans cela, une branche avec PR ouverte
  # déclenche deux fois le même travail, une fois par « push » et une fois par
  # « pull_request ».
  push:
    branches: [main]
  pull_request:

# Un push qui suit de près le précédent annule le premier : inutile de payer
# deux fois la même vérification.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dotnet:
    name: Middleware — build et tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restaurer
        run: dotnet restore SageFne.sln

      - name: Compiler
        run: dotnet build SageFne.sln --no-restore --configuration Release

      - name: Tester
        run: dotnet test SageFne.sln --no-build --configuration Release --verbosity normal

  supabase:
    name: Base d'audit — migrations et invariants
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports: ['5432:5432']

    steps:
      - uses: actions/checkout@v4

      - name: Client psql
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Migrations et invariants
        env:
          PGPASSWORD: postgres
        run: ./supabase/tests/executer.sh "postgres://postgres@localhost:5432/postgres"

  installeur:
    name: Installeur Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # L'exécutable livré au client se construit ici, et nulle part ailleurs :
      # un binaire compilé sur le poste de quelqu'un n'est pas reproductible, et
      # personne ne saurait dire de quel commit il vient.
      - name: Construire SageFneSetup.exe
        shell: pwsh
        run: ./deploiement/construire-installeur.ps1 -Version "1.0.${{ github.run_number }}"

      # Il doit au moins démarrer, lire ses arguments et rendre son aide. Le
      # reste - service, variables machine - demande un poste réel.
      - name: Vérifier qu'il répond
        shell: pwsh
        run: |
          $exe = 'publication/SageFneSetup.exe'
          if (-not (Test-Path $exe)) { throw "L'exécutable n'a pas été produit." }

          $aide = & $exe --aide
          if ($LASTEXITCODE -ne 0) { throw "--aide a répondu $LASTEXITCODE." }
          if (-not ($aide -join "`n").Contains('LECTURE SEULE')) {
            throw "L'aide ne rappelle plus que le compte SQL doit être en lecture seule."
          }

          # Une simulation ne doit rien écrire, et refuser ce qui manque.
          & $exe --simulation --silencieux
          $refus = $LASTEXITCODE
          if ($refus -eq 0) { throw "Une demande vide aurait dû être refusée." }

          $taille = [math]::Round((Get-Item $exe).Length / 1MB, 1)
          Write-Host "  SageFneSetup.exe : $taille Mo, autonome."
          Write-Host "  Une demande vide est refusée ($refus), comme attendu."

          # Sans cette ligne, l'étape échoue alors que tout s'est bien passé :
          # le lanceur d'Actions termine par « exit $LASTEXITCODE », et
          # Write-Host ne remet pas ce code à zéro. Le dernier refus attendu,
          # qui vaut 1, deviendrait donc le verdict de l'étape.
          exit 0

      - uses: actions/upload-artifact@v4
        with:
          name: SageFneSetup
          path: publication/SageFneSetup.exe
          retention-days: 90

  secrets:
    name: Aucun secret dans le dépôt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Le mot de passe SQL et la clé FNE n'ont jamais leur place ici. Le script
      # se vérifie d'abord sur un faux secret : un détecteur cassé doit échouer,
      # pas afficher « rien trouvé ».
      - name: Chercher des valeurs en dur
        run: ./.github/scripts/verifier-secrets.sh
